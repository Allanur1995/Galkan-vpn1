name: Build Galkan VPN APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Licenses & Platform Tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36.1" >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Prepare .env from GitHub Secrets (fallback to test AdMob IDs)
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          lines = env_path.read_text(encoding="utf-8").splitlines()
          overrides = {
              k: os.environ.get(k, "")
              for k in ("ADMOB_APP_ID", "ADMOB_BANNER_ID", "ADMOB_REWARDED_ID", "ADMOB_INTERSTITIAL_ID")
              if os.environ.get(k, "").strip()
          }
          out = []
          for line in lines:
              replaced = False
              for k, v in overrides.items():
                  if line.startswith(f"{k}="):
                      out.append(f"{k}={v}")
                      replaced = True
                      break
              if not replaced:
                  out.append(line)
          env_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Build Debug APK
        id: build_debug
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Galkan-VPN-debug.apk

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Signed Release APK & AAB (if keystore secrets provided)
        id: build_release
        shell: bash
        env:
          KEYSTORE_BASE64_VALUE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -n "$KEYSTORE_BASE64_VALUE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64_VALUE" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk Galkan-VPN-release.apk
            cp app/build/outputs/bundle/release/app-release.aab Galkan-VPN-release.aab
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not set; skipping signed release APK/AAB."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact
        if: always() && steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Debug-APK
          path: Galkan-VPN-debug.apk
          retention-days: 30

      - name: Upload Release APK & AAB Artifacts
        if: steps.build_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Release-Signed
          path: |
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: Galkan-VPN-Debug-APK

      - name: Download Release Artifacts (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Galkan-VPN-Release-Signed

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Galkan-VPN-debug.apk
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          fail_on_unmatched_files: false
