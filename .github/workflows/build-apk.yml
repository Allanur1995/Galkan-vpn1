name: Build Galkan VPN APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" || true
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT"
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"
          INSTALL_STATUS=$?
          set -o pipefail
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "ERROR: sdkmanager failed with exit code $INSTALL_STATUS"
            exit "$INSTALL_STATUS"
          fi

          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          test -d "$SDK_ROOT/platforms/android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Verify Gradle installation
        shell: bash
        run: gradle --version

      - name: Restore debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Prepare .env and AdMob environment variables
        shell: bash
        env:
          ADMOB_APP_ID_SECRET: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID_SECRET: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID_SECRET: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID_SECRET: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          cp .env.example .env
          if [ -n "$ADMOB_APP_ID_SECRET" ]; then
            echo "ADMOB_APP_ID=$ADMOB_APP_ID_SECRET" >> "$GITHUB_ENV"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          lines = env_path.read_text(encoding="utf-8").splitlines()
          mapping = {
              "ADMOB_APP_ID": os.environ.get("ADMOB_APP_ID_SECRET", "").strip(),
              "ADMOB_BANNER_ID": os.environ.get("ADMOB_BANNER_ID_SECRET", "").strip(),
              "ADMOB_REWARDED_ID": os.environ.get("ADMOB_REWARDED_ID_SECRET", "").strip(),
              "ADMOB_INTERSTITIAL_ID": os.environ.get("ADMOB_INTERSTITIAL_ID_SECRET", "").strip(),
          }
          overrides = {k: v for k, v in mapping.items() if v}
          out = []
          for line in lines:
              replaced = False
              for k, v in overrides.items():
                  if line.startswith(f"{k}="):
                      out.append(f"{k}={v}")
                      replaced = True
                      break
              if not replaced:
                  out.append(line)
          env_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Build Debug APK
        id: build_debug
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Galkan-VPN-debug.apk

      - name: Run Unit Tests
        shell: bash
        run: gradle testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Build Signed Release APK & AAB (when keystore env vars are present)
        id: build_release
        shell: bash
        env:
          KEYSTORE_BASE64_VALUE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64_VALUE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64_VALUE" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
            gradle assembleRelease bundleRelease --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/apk/release/app-release.apk Galkan-VPN-release.apk
            cp app/build/outputs/bundle/release/app-release.aab Galkan-VPN-release.aab
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing environment variables not configured; skipping signed release build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact
        if: always() && steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Debug-APK
          path: Galkan-VPN-debug.apk
          retention-days: 30

      - name: Upload Release APK & AAB Artifacts
        if: steps.build_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Release-Signed
          path: |
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: Galkan-VPN-Debug-APK

      - name: Download Release Artifacts (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Galkan-VPN-Release-Signed

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Galkan-VPN-debug.apk
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          fail_on_unmatched_files: false
